stages:
  - build

build-windows:
  stage: build
  tags:
    - windows
  script:
    - flutter pub get
    - flutter build windows --release
  artifacts:
    name: "myarap-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/windows/x64/runner/Release/
    expire_in: 30 days
  only:
    - develop
    - main
    - master
    - /^release\/.*/
