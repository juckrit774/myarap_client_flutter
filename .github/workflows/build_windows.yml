name: Build Windows

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # ── EXE Installer (Inno Setup) ──────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create EXE installer
        run: iscc installer\setup.iss

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: MyARAP_Setup_EXE
          path: installer/installer_output/MyARAP_Setup.exe
          retention-days: 30

      # ── MSI Installer (WiX v3) ───────────────────────────────────────────
      - name: Install WiX v3
        shell: powershell
        run: |
          choco install wixtoolset --version 3.11.2.4516 -y --force
          echo "WiX installed"

      - name: Build MSI
        shell: powershell
        run: |
          $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory | Select-Object -First 1
          if (-not $wixDir) { Write-Error "WiX not found"; exit 1 }
          $wixPath = Join-Path $wixDir.FullName "bin"
          Write-Host "Using WiX at: $wixPath"
          New-Item -ItemType Directory -Force -Path installer\installer_output | Out-Null
          & "$wixPath\heat.exe" dir build\windows\x64\runner\Release -cg AppFiles -dr INSTALLFOLDER -gg -scom -sreg -sfrag -srd -out installer\AppFiles.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wixPath\candle.exe" installer\product.wxs installer\AppFiles.wxs -out installer\ -arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wixPath\light.exe" installer\product.wixobj installer\AppFiles.wixobj -out installer\installer_output\MyARAP.msi -ext WixUIExtension
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: MyARAP_Setup_MSI
          path: installer/installer_output/MyARAP.msi
          retention-days: 30
