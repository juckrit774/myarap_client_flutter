name: Build Windows

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # ── EXE Installer (Inno Setup) ──────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create EXE installer
        run: iscc installer\setup.iss

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MyARAP_Setup_EXE
          path: installer/installer_output/MyARAP_Setup.exe
          retention-days: 30

      # ── MSI Installer (WiX v4) ───────────────────────────────────────────
      - name: Install WiX v4
        run: dotnet tool install --global wix

      - name: Build MSI
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer\installer_output | Out-Null
          wix --version
          wix build installer\product.wxs -o installer\installer_output\MyARAP.msi

      - name: Upload WiX build log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wix_build_log
          path: wix_build.log
          retention-days: 7

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MyARAP_Setup_MSI
          path: installer/installer_output/MyARAP.msi
          retention-days: 30
